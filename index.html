<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Recipes</title>
<style>
:root{--bg:#edf1ea;--card:#fbfcfa;--ink:#1d2a22;--mut:#5f6f65;--acc:#2f5d46;--acct:#fff;--sf:#e2a400;--line:#d3dccf;--chip:#dde7d8}
@media(prefers-color-scheme:dark){:root{--bg:#141b17;--card:#1d2722;--ink:#e8efe9;--mut:#9bb0a2;--acc:#6fbf94;--acct:#10201a;--sf:#f0b92a;--line:#2f3d35;--chip:#2a3830}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
h1{margin:0;flex:1;font-size:1.6rem;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:20px 0 8px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--acc);color:var(--acct);border-color:var(--acc);font-weight:600}
button.d{color:#c0392b}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sf);outline-offset:1px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:90px;resize:vertical}
.bar{display:grid;grid-template-columns:1fr auto;gap:8px}
@media(max-width:620px){.bar{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--acc)}
.card b{display:block;margin-bottom:6px}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 10px;font-size:.8rem;margin:0 4px 4px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg{border-radius:99px;padding:2px 12px;font-size:.85rem;background:var(--chip);border-color:transparent}
.tg.on{background:var(--acc);color:var(--acct);font-weight:600}
.mut{color:var(--mut);font-size:.88rem}
dialog{width:min(640px,calc(100% - 20px));max-height:92vh;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:18px}
dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 3px;font-size:.88rem;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row>*{flex:0 0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
li{margin:4px 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;max-width:90%}
</style></head><body><main>
<header><h1>My Recipes</h1><button class="p" onclick="addFlow()">Add recipe</button><button onclick="settings()" aria-label="Settings">⚙</button></header>
<div class="bar"><input id="q" placeholder="Search by ingredients, e.g. spinach, paneer" oninput="render()"><select id="mode" onchange="render()"><option value="any">Any of these</option><option value="all">All of these</option></select></div>
<div id="tagbar" class="tags"></div>
<div id="rec"></div>
<h2 id="lh"></h2><div id="list" class="grid"></div>
</main>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
let sel=new Set(),TL=[];
const tagsOf=r=>[...new Set([...(r.tags||[]),r.audience,r.protein].filter(Boolean).map(t=>String(t).toLowerCase().trim()))];
let recipes=[];

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4000)}
function cfg(){
  const gh=location.hostname.endsWith('github.io');
  const d={owner:gh?location.hostname.split('.')[0]:'',repo:gh?location.pathname.split('/')[1]||'':'',branch:'main',token:''};
  try{return {...d,...JSON.parse(localStorage.getItem('cfg')||'{}')}}catch{return d}
}
async function gh(method,body){
  const c=cfg();
  const url=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/recipes.json`+(method==='GET'?`?ref=${c.branch}&t=${Date.now()}`:'');
  const r=await fetch(url,{method,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=new Error(r.status+' '+(await r.text()).slice(0,120));e.status=r.status;throw e}
  const j=await r.json();
  if(method!=='GET')return j;
  const bin=atob(j.content.replace(/\n/g,''));
  return {data:JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0)))),sha:j.sha};
}
async function mutate(fn,msg){
  const c=cfg();
  if(!c.token||!c.owner||!c.repo){toast('Add your GitHub token in ⚙ first');return false}
  for(let i=0;i<2;i++){
    try{
      const {data,sha}=await gh('GET');
      const next=fn(data);
      let bin='';new TextEncoder().encode(JSON.stringify(next,null,2)+'\n').forEach(b=>bin+=String.fromCharCode(b));
      await gh('PUT',{message:msg,content:btoa(bin),sha,branch:c.branch});
      recipes=next;render();return true;
    }catch(e){if((e.status!==409&&e.status!==422)||i){toast('Save failed: '+e.message);return false}}
  }
}
async function load(){
  const c=cfg();
  try{
    if(c.token&&c.owner&&c.repo)recipes=(await gh('GET')).data;
    else recipes=await (await fetch('recipes.json?v='+Date.now())).json();
  }catch(e){toast('Could not load recipes: '+e.message)}
  render();
}

const last=r=>(r.tried||[]).slice().sort().pop();
const ago=d=>Math.floor((Date.now()-new Date(d+'T00:00:00'))/864e5);
const chips=r=>tagsOf(r).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
const triedTxt=r=>{const l=last(r);return l?`Last made ${ago(l)===0?'today':ago(l)+' days ago'}`:'Not tried yet'};

function filtered(){
  const q=$('#q').value.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean),all=$('#mode').value==='all';
  return recipes.filter(r=>{
    if(sel.size){const t=tagsOf(r);if(![...sel].every(x=>t.includes(x)))return false}
    if(!q.length)return true;
    const hay=(r.ingredients||[]).map(s=>s.toLowerCase());
    const hit=t=>hay.some(i=>i.includes(t))||(r.title||'').toLowerCase().includes(t);
    return all?q.every(hit):q.some(hit);
  });
}
const card=(r,extra)=>`<button class="card" onclick="detail('${esc(r.id)}')"><b>${esc(r.title)}</b>${chips(r)}<div class="mut">${extra||triedTxt(r)}</div></button>`;
function render(){
  TL=[...new Set(recipes.flatMap(tagsOf))].sort();
  sel=new Set([...sel].filter(t=>TL.includes(t)));
  $('#tagbar').innerHTML=TL.map(t=>`<button class="tg ${sel.has(t)?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')+(sel.size?'<button class="tg" data-t="">Clear</button>':'');
  const f=filtered();
  const sugg=$('#q').value.trim()?[]:f.map(r=>({r,s:last(r)?ago(last(r)):45})).filter(x=>x.s>=21).sort((a,b)=>b.s-a.s).slice(0,4);
  $('#rec').innerHTML=sugg.length?`<h2>Time to make again</h2><div class="grid">${sugg.map(x=>card(x.r,last(x.r)?`Last made ${x.s} days ago`:'Not tried yet')).join('')}</div>`:'';
  $('#lh').textContent=`${f.length} of ${recipes.length} recipes`;
  $('#list').innerHTML=f.length?f.map(r=>card(r)).join(''):'<p class="mut">No recipes match. Clear the search or add a new one.</p>';
}

function show(h){const d=$('#dlg');d.innerHTML=h;if(!d.open)d.showModal()}
const close=()=>$('#dlg').close();
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')close()});

function detail(id){
  const r=recipes.find(x=>x.id===id);if(!r)return;
  const t=(r.tried||[]).slice().sort().reverse();
  show(`<h2 style="margin-top:0;font-size:1.4rem">${esc(r.title)}</h2>${chips(r)}
  <div class="mut">${[r.servings&&'Serves '+esc(r.servings),r.time&&esc(r.time)].filter(Boolean).join(' · ')}</div>
  ${r.source_url?`<p><a href="${esc(r.source_url)}" target="_blank" rel="noopener noreferrer">Original recipe link</a></p>`:''}
  <h2>Ingredients</h2><ul>${(r.ingredients||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
  <h2>Steps</h2><ol>${(r.steps||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ol>
  ${r.notes?`<h2>Notes</h2><p>${esc(r.notes)}</p>`:''}
  <h2>Tried</h2>${t.length?t.map(d=>`<div>${esc(d)} <button onclick="untry('${esc(r.id)}','${esc(d)}')" aria-label="Remove date">✕</button></div>`).join(''):'<p class="mut">Not tried yet.</p>'}
  <div class="row"><input id="td" type="date" value="${today()}" style="width:auto"><button class="p" onclick="tried('${esc(r.id)}')">Mark as tried</button></div>
  <div class="row"><button onclick="editForm('${esc(r.id)}')">Edit</button><button class="d" onclick="del('${esc(r.id)}')">Delete</button><button onclick="close()">Close</button></div>`);
}
async function tried(id){const d=$('#td').value||today();if(await mutate(a=>a.map(r=>r.id===id?{...r,tried:[...new Set([...(r.tried||[]),d])].sort()}:r),'Mark tried: '+id))detail(id)}
async function untry(id,d){if(await mutate(a=>a.map(r=>r.id===id?{...r,tried:(r.tried||[]).filter(x=>x!==d)}:r),'Remove tried date'))detail(id)}
async function del(id){const r=recipes.find(x=>x.id===id);if(confirm('Delete "'+r.title+'"?')&&await mutate(a=>a.filter(x=>x.id!==id),'Delete recipe: '+r.title)){close();toast('Deleted')}}

function addTag(i){const f=$('#f-tags');const c=f.value.split(',').map(x=>x.trim()).filter(Boolean);if(!c.includes(TL[i]))c.push(TL[i]);f.value=c.join(', ')}
function editForm(id,draft){
  const r=draft||recipes.find(x=>x.id===id)||{};
  show(`<h2 style="margin-top:0">${id?'Edit recipe':'Review and save'}</h2>
  <label>Title</label><input id="f-title" value="${esc(r.title)}">
  <label>Tags (comma-separated)</label><input id="f-tags" value="${esc(tagsOf(r).join(', '))}">
  <div class="tags" style="margin-top:6px">${TL.map((t,i)=>`<button class="tg" onclick="addTag(${i})">${esc(t)}</button>`).join('')}</div>
  <div class="two"><div><label>Servings</label><input id="f-serv" value="${esc(r.servings)}"></div><div><label>Time</label><input id="f-time" value="${esc(r.time)}"></div></div>
  <label>Source link</label><input id="f-url" value="${esc(r.source_url)}">
  <label>Ingredients (one per line)</label><textarea id="f-ing">${esc((r.ingredients||[]).join('\n'))}</textarea>
  <label>Steps (one per line)</label><textarea id="f-steps">${esc((r.steps||[]).join('\n'))}</textarea>
  <label>Notes</label><textarea id="f-notes" style="min-height:50px">${esc(r.notes)}</textarea>
  <div class="row"><button class="p" onclick="saveForm('${esc(id||'')}')">Save recipe</button><button onclick="${id?`detail('${esc(id)}')`:'close()'}">Cancel</button></div>`);
}
async function saveForm(id){
  const L=s=>$(s).value.split('\n').map(x=>x.trim()).filter(Boolean);
  const rec={title:$('#f-title').value.trim(),servings:$('#f-serv').value.trim(),time:$('#f-time').value.trim(),source_url:$('#f-url').value.trim(),ingredients:L('#f-ing'),steps:L('#f-steps'),notes:$('#f-notes').value.trim(),tags:[...new Set($('#f-tags').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean))],audience:undefined,protein:undefined};
  if(!rec.title){toast('Add a title');return}
  const ok=id?await mutate(a=>a.map(r=>r.id===id?{...r,...rec}:r),'Edit recipe: '+rec.title)
    :await mutate(a=>[...a,{id:Date.now().toString(36),...rec,added:today(),tried:[]}],'Add recipe: '+rec.title);
  if(ok){id?detail(id):close();toast('Saved')}
}

function prompt_(url,text){
  const src=(url?'Link: '+url+'\n':'')+(text?'Recipe text:\n'+text:'');
  return `You are helping me add a recipe to my personal recipe database, which is a JSON file. Follow these instructions exactly.

INPUT
I will give you either (a) a link to a recipe (website, YouTube, Instagram), or (b) the recipe text itself (caption, transcript, or pasted page). Use only what is in that source. If both a link and text are given, use the text and keep the link as source_url.
- If I gave only a link and you cannot open it, or the recipe is not in the page text (for example it is only spoken or shown in a video), reply with only the word CANNOT_EXTRACT and nothing else. Do not guess or reconstruct a recipe from the title.
- If the source is missing a detail (servings, time, quantities), leave that field as an empty string "" or omit that detail from the ingredient line. Never invent values.

OUTPUT
Reply with ONLY one JSON object inside a single code block. No text before or after it, no trailing comma, no comments. Use exactly this shape and these field names:

{
  "id": "",
  "title": "",
  "servings": "",
  "time": "",
  "source_url": "",
  "ingredients": [],
  "steps": [],
  "notes": "",
  "tags": [],
  "added": "",
  "tried": []
}

FIELD RULES
- id: lowercase slug of the title using only a-z, 0-9 and hyphens, followed by a hyphen and 4 random characters (e.g. "palak-paneer-k3x9"). It must be unique.
- title: the recipe's name, in plain text.
- servings: a string like "4" or "2 adults + 1 toddler", or "".
- time: total time as a string like "35 min", or "".
- source_url: the link I gave you, or "" if I gave text only.
- ingredients: an array of strings, one ingredient per item, each with its quantity and unit as written in the source (e.g. "1 cup basmati rice", "2 tbsp ghee"). Keep the source's units. Do not merge or drop items.
- steps: an array of strings, one step per item, in order, written as clear instructions. Do not number them.
- notes: tips, substitutions or baby-friendly adjustments mentioned in the source, as one string, or "".
- tags: an array of 3 to 8 short lowercase tags. ALWAYS include: (1) who it is for: "baby" if made for babies or toddlers, "adult" for a regular meal, or both "baby" and "adult" if it suits both (as written or with a simple tweak mentioned in the source); (2) the main protein, one of "veg", "egg", "chicken", "fish", "meat" ("veg" if there is no meat, fish or egg; dairy and lentils count as veg). Then add cuisine, meal type or method tags (e.g. "indian", "breakfast", "one-pot"). Use the same word every time for the same thing.
- added: today's date as YYYY-MM-DD, which is the date I give you below.
- tried: always an empty array [].

JSON RULES
- Valid JSON only: double quotes, escape any quotes inside strings, no line breaks inside strings.
- Write the recipe in English, translating if the source is in another language.

SOURCE
${src||'(none provided)'}
Today's date: ${today()}`;
}
function addFlow(){
  show(`<h2 style="margin-top:0">Add a recipe</h2>
  <label>1. Recipe link (Instagram, YouTube, website)</label><input id="a-url" placeholder="https://">
  <div class="row"><button class="p" onclick="cp(prompt_($('#a-url').value.trim()))">Copy prompt for AI chat</button></div>
  <p class="mut">Paste it into your AI chat. If it replies CANNOT_EXTRACT, use the text option below.</p>
  <details><summary>Link will not open? Use the recipe text instead</summary><label>Recipe text or video transcript</label><textarea id="a-text"></textarea>
  <div class="row"><button onclick="cp(prompt_($('#a-url').value.trim(),$('#a-text').value.trim()))">Copy prompt with text</button></div></details>
  <label>2. Paste the AI's reply here</label><textarea id="a-json" placeholder='{"title": ...}'></textarea>
  <div class="row"><button class="p" onclick="parseReply()">Continue</button><button onclick="close()">Cancel</button></div>`);
}
async function cp(t){if(!t){toast('Add a link or text first');return}try{await navigator.clipboard.writeText(t);toast('Prompt copied')}catch{toast('Copy failed')}}
function parseReply(){
  const t=$('#a-json').value,a=t.indexOf('{'),b=t.lastIndexOf('}');
  try{
    const j=JSON.parse(t.slice(a,b+1));
    editForm('',{...j,source_url:$('#a-url').value.trim()||j.source_url||''});
  }catch{toast(t.includes('CANNOT_EXTRACT')?'Extraction failed. Use the recipe text option.':'That is not valid JSON. Ask the chat to resend only the JSON.')}
}
function settings(){
  const c=cfg();
  show(`<h2 style="margin-top:0">GitHub connection</h2><p class="mut">Needed to add, edit and delete. Stored only in this browser.</p>
  <div class="two"><div><label>Owner</label><input id="s-o" value="${esc(c.owner)}"></div><div><label>Repository</label><input id="s-r" value="${esc(c.repo)}"></div></div>
  <label>Branch</label><input id="s-b" value="${esc(c.branch)}">
  <label>Fine-grained token (Contents: read and write)</label><input id="s-t" type="password" value="${esc(c.token)}" autocomplete="off">
  <div class="row"><button class="p" onclick="saveSettings()">Save</button><button onclick="close()">Cancel</button></div>`);
}
function saveSettings(){
  const o={owner:$('#s-o').value.trim(),repo:$('#s-r').value.trim(),branch:$('#s-b').value.trim(),token:$('#s-t').value.trim()};
  Object.keys(o).forEach(k=>!o[k]&&delete o[k]);
  localStorage.setItem('cfg',JSON.stringify(o));close();load();
}
$('#tagbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;if(!t)sel.clear();else if(sel.has(t))sel.delete(t);else sel.add(t);render()});
load();
</script></body></html>
