<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Cookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1ea;--card:#fbfcfa;--ink:#1d2a22;--mut:#5f6f65;--acc:#2f5d46;--acct:#fff;--sf:#e2a400;--line:#d3dccf;--chip:#dde7d8;--link:#2f6fd6}
@media(prefers-color-scheme:dark){:root{--bg:#141b17;--card:#1d2722;--ink:#e8efe9;--mut:#9bb0a2;--acc:#6fbf94;--acct:#10201a;--sf:#f0b92a;--line:#2f3d35;--chip:#2a3830;--link:#7db8ff}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 Nunito,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
a{color:var(--link)}
h1{margin:0;flex:1;font-size:1.6rem;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:20px 0 8px}
button,select,input,textarea,summary{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--acc);color:var(--acct);border-color:var(--acc);font-weight:600}
button.d{color:#c0392b}
:focus-visible{outline:2px solid var(--sf);outline-offset:1px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=checkbox]{width:auto}
textarea{min-height:90px;resize:vertical}
.bar{display:grid;grid-template-columns:1fr auto;gap:8px}
.bar2{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.bar2 select{width:auto}
@media(max-width:620px){.bar{grid-template-columns:1fr}}
#tagdd{position:relative}
summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{position:absolute;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:280px;overflow:auto;min-width:210px;margin-top:4px}
.ck{display:flex;gap:8px;align-items:flex-start;margin:3px 0;color:var(--ink);font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.card:hover{border-color:var(--acc)}
.card b{display:block;margin-bottom:6px}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 10px;font-size:.8rem;margin:0 4px 4px 0}
.chip.plan{background:var(--sf);color:#241a00}
.chip.warn{background:#c0392b;color:#fff}
.mut{color:var(--mut);font-size:.88rem}
.pl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.pl .mut{min-width:78px}
dialog{width:min(640px,calc(100% - 20px));max-height:92vh;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:18px}
dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 3px;font-size:.88rem;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tg{border-radius:99px;padding:2px 12px;font-size:.85rem;background:var(--chip);border-color:transparent}
li{margin:4px 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;max-width:90%}
</style></head><body><main>
<header><h1>Our Cookbook</h1><button class="p" onclick="addFlow()">Add recipe</button><button onclick="settings()" aria-label="Settings">⚙</button></header>
<div class="bar"><input id="q" placeholder="Search by ingredients, e.g. spinach, paneer" oninput="render()"><select id="mode" onchange="render()"><option value="any">Any of these</option><option value="all">All of these</option></select></div>
<div class="bar2">
 <details id="tagdd"><summary id="tagsum">All tags ▾</summary><div id="tagpanel" class="panel"></div></details>
 <select id="tf" onchange="showAll=false;render()"><option value="">Any time</option><option value="never">Not tried yet</option><option value="week">Made this week</option><option value="2w">Made over 2 weeks ago</option><option value="1m">Made over a month ago</option><option value="3m">Made over 3 months ago</option></select>
 <label id="hidewrap" class="ck" style="margin:0;display:none"><input type="checkbox" id="hide" onchange="render()"><span id="hidetxt"></span></label>
</div>
<div id="plan"></div>
<h2 id="lh"></h2><div id="list" class="grid"></div><div id="more" class="row"></div>
</main>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const A=x=>Array.isArray(x)?x.map(v=>String(v).trim()).filter(Boolean):[];
const L=s=>s.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
const uniq=a=>[...new Set(a)];
let recipes=[],sel=new Set(),TL=[],showAll=false,pending=[];
const tagsOf=r=>uniq([...A(r.tags),r.audience,r.protein].filter(Boolean).map(t=>String(t).toLowerCase().trim()));
const avoid=()=>L(localStorage.getItem('avoid')||'');
const flags=r=>{const ing=[...A(r.ingredients),r.title||''].join(' ').toLowerCase();return avoid().filter(a=>A(r.allergens).includes(a)||new RegExp('\\b'+a.replace(/[^a-z0-9 ]/g,'')+'s?\\b').test(ing))};

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4000)}
function cfg(){
  const g=location.hostname.endsWith('github.io');
  const d={owner:g?location.hostname.split('.')[0]:'',repo:g?location.pathname.split('/')[1]||'':'',branch:'main',token:''};
  try{return {...d,...JSON.parse(localStorage.getItem('cfg')||'{}')}}catch{return d}
}
async function gh(method,body){
  const c=cfg();
  const url=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/recipes.json`+(method==='GET'?`?ref=${c.branch}&t=${Date.now()}`:'');
  const r=await fetch(url,{method,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=new Error(r.status+' '+(await r.text()).slice(0,120));e.status=r.status;throw e}
  const j=await r.json();
  if(method!=='GET')return j;
  const bin=atob(j.content.replace(/\n/g,''));
  return {data:JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0)))),sha:j.sha};
}
async function mutate(fn,msg){
  const c=cfg();
  if(!c.token||!c.owner||!c.repo){toast('Add your GitHub token in ⚙ first');return false}
  for(let i=0;i<2;i++){
    try{
      const {data,sha}=await gh('GET');
      const next=fn(data);
      let bin='';new TextEncoder().encode(JSON.stringify(next,null,2)+'\n').forEach(b=>bin+=String.fromCharCode(b));
      await gh('PUT',{message:msg,content:btoa(bin),sha,branch:c.branch});
      recipes=next;render();return true;
    }catch(e){if((e.status!==409&&e.status!==422)||i){toast('Save failed: '+e.message);return false}}
  }
}
async function load(){
  const c=cfg();
  try{
    if(c.token&&c.owner&&c.repo)recipes=(await gh('GET')).data;
    else recipes=await (await fetch('recipes.json?v='+Date.now())).json();
  }catch(e){toast('Could not load recipes: '+e.message)}
  render();
}

const last=r=>(r.tried||[]).slice().sort().pop();
const ago=d=>Math.floor((Date.now()-new Date(d+'T00:00:00'))/864e5);
const days=r=>{const l=last(r);return l?ago(l):null};
const rel=d=>{const n=ago(d);if(n<=0)return 'today';if(n===1)return 'yesterday';if(n<7)return n+' days ago';if(n<14)return 'last week';if(n<30)return Math.floor(n/7)+' weeks ago';if(n<365){const m=Math.max(1,Math.floor(n/30));return m===1?'1 month ago':m+' months ago'}const y=Math.floor(n/365);return y===1?'1 year ago':y+' years ago'};
const fmtMD=d=>{const x=new Date(d+'T00:00:00'),o={month:'short',day:'numeric'};if(x.getFullYear()!==new Date().getFullYear())o.year='numeric';return x.toLocaleDateString('en-US',o)};
const fmtT=d=>rel(d)+' · '+fmtMD(d);
const isPlanned=r=>Array.isArray(r.planned)?r.planned.length>0:!!r.planned;
const warn=r=>flags(r).map(f=>`<span class="chip warn">⚠ ${esc(f)}</span>`).join('');
const chips=r=>tagsOf(r).map(t=>`<span class="chip">${esc(t)}</span>`).join('')+warn(r);
const triedTxt=r=>{const l=last(r);return l?'Made '+fmtT(l):'Not tried yet'};
const T={never:d=>d===null,week:d=>d!==null&&d<=7,'2w':d=>d!==null&&d>=14,'1m':d=>d!==null&&d>=30,'3m':d=>d!==null&&d>=90};

function filtered(){
  const q=$('#q').value.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean),all=$('#mode').value==='all',t=$('#tf').value,hide=$('#hide').checked;
  return recipes.filter(r=>{
    if(sel.size){const g=tagsOf(r);if(![...sel].every(x=>g.includes(x)))return false}
    if(hide&&flags(r).length)return false;
    if(t&&!T[t](days(r)))return false;
    if(!q.length)return true;
    const hay=A(r.ingredients).map(s=>s.toLowerCase());
    const hit=x=>hay.some(i=>i.includes(x))||(r.title||'').toLowerCase().includes(x);
    return all?q.every(hit):q.some(hit);
  });
}
const card=r=>`<button class="card" onclick="detail('${esc(r.id)}')"><b>${esc(r.title)}</b>${isPlanned(r)?'<span class="chip plan">Planned</span>':''}${warn(r)}<div class="mut">${triedTxt(r)}</div></button>`;
function render(){
  TL=uniq(recipes.flatMap(tagsOf)).sort();
  sel=new Set([...sel].filter(t=>TL.includes(t)));
  $('#tagsum').textContent=(sel.size?[...sel].join(', '):'All tags')+' ▾';
  $('#tagpanel').innerHTML=TL.map(t=>`<label class="ck"><input type="checkbox" data-t="${esc(t)}" ${sel.has(t)?'checked':''}>${esc(t)}</label>`).join('')+(sel.size?'<button data-t="">Clear</button>':'')||'<span class="mut">No tags yet</span>';
  const av=avoid();$('#hidewrap').style.display=av.length?'':'none';$('#hidetxt').textContent='Hide '+av.join(', ');
  const pl=recipes.filter(isPlanned).sort((a,b)=>a.title.localeCompare(b.title));
  $('#plan').innerHTML=pl.length?`<h2>Meal plan</h2>${pl.map(r=>`<div class="pl"><a href="#" onclick="detail('${esc(r.id)}');return false">${esc(r.title)}</a><button onclick="made('${esc(r.id)}')">Made it</button><button onclick="setPlan('${esc(r.id)}',false)" aria-label="Remove from plan">✕</button></div>`).join('')}`:'';
  const f=filtered(),t=$('#tf').value;
  if(t)f.sort((a,b)=>(days(b)??1e9)-(days(a)??1e9));
  const shown=t&&!showAll?f.slice(0,5):f;
  $('#lh').textContent=`${f.length} of ${recipes.length} recipes`;
  $('#list').innerHTML=shown.length?shown.map(r=>card(r)).join(''):'<p class="mut">No recipes match. Clear the filters or add a new one.</p>';
  $('#more').innerHTML=shown.length<f.length?`<button onclick="showAll=true;render()">Show all ${f.length}</button>`:'';
}
$('#tagpanel').addEventListener('change',e=>{const t=e.target.dataset.t;e.target.checked?sel.add(t):sel.delete(t);render()});
$('#tagpanel').addEventListener('click',e=>{if(e.target.dataset.t!=='')return;sel.clear();render()});
document.addEventListener('click',e=>{if(!e.target.closest('#tagdd'))$('#tagdd').open=false});

function show(h){const d=$('#dlg');d.innerHTML=h;if(!d.open)d.showModal()}
const close=()=>$('#dlg').close();
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')close()});

function detail(id){
  const r=recipes.find(x=>x.id===id);if(!r)return;
  const t=(r.tried||[]).slice().sort().reverse(),pl=isPlanned(r);
  const dl=(arr,fn)=>arr.map(d=>`<div>${esc(fmtT(d))} <button onclick="${fn}('${esc(r.id)}','${esc(d)}',1)" aria-label="Remove date">✕</button></div>`).join('');
  show(`<h2 style="margin-top:0;font-size:1.4rem">${esc(r.title)}</h2>${chips(r)}
  <div class="mut">${[r.servings&&'Serves '+esc(r.servings),r.time&&esc(r.time)].filter(Boolean).join(' · ')}</div>
  ${r.source_url?`<p><a href="${esc(r.source_url)}" target="_blank" rel="noopener noreferrer">Original recipe link</a></p>`:''}
  ${A(r.ingredients).length||A(r.steps).length?`<h2>Ingredients</h2><ul>${A(r.ingredients).map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h2>Steps</h2><ol>${A(r.steps).map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`:'<p class="mut">Only the name is saved. Use Edit to add details.</p>'}
  ${r.notes?`<h2>Notes</h2><p>${esc(r.notes)}</p>`:''}
  <div class="row"><button onclick="setPlan('${esc(r.id)}',${!pl})">${pl?'Remove from plan':'Add to plan'}</button></div>
  <h2>Tried</h2>${t.length?dl(t,'untry'):'<p class="mut">Not tried yet.</p>'}
  <div class="row"><input id="td" type="date" value="${today()}" style="width:auto"><button class="p" onclick="tried('${esc(r.id)}')">Mark as tried</button></div>
  <div class="row"><button onclick="editForm('${esc(r.id)}')">Edit</button><button class="d" onclick="del('${esc(r.id)}')">Delete</button><button onclick="close()">Close</button></div>`);
}
const upd=(id,fn)=>a=>a.map(r=>r.id===id?fn(r):r);
async function tried(id){const d=$('#td').value||today();if(await mutate(upd(id,r=>({...r,tried:uniq([...A(r.tried),d]).sort()})),'Mark tried'))detail(id)}
async function untry(id,d){if(await mutate(upd(id,r=>({...r,tried:A(r.tried).filter(x=>x!==d)})),'Remove tried date'))detail(id)}
async function setPlan(id,v){if(await mutate(upd(id,r=>({...r,planned:v})),v?'Plan recipe':'Unplan recipe')&&$('#dlg').open)detail(id)}
async function made(id){await mutate(upd(id,r=>({...r,tried:uniq([...A(r.tried),today()]).sort(),planned:false})),'Made from plan')}
async function del(id){const r=recipes.find(x=>x.id===id);if(confirm('Delete "'+r.title+'"?')&&await mutate(a=>a.filter(x=>x.id!==id),'Delete recipe: '+r.title)){close();toast('Deleted')}}

function addTag(i){const f=$('#f-tags');const c=L(f.value);if(!c.includes(TL[i]))c.push(TL[i]);f.value=c.join(', ')}
function editForm(id){
  const r=recipes.find(x=>x.id===id)||{};
  show(`<h2 style="margin-top:0">Edit recipe</h2>
  <label>Title</label><input id="f-title" value="${esc(r.title)}">
  <label>Tags (comma-separated)</label><input id="f-tags" value="${esc(tagsOf(r).join(', '))}">
  <div class="tags">${TL.map((t,i)=>`<button class="tg" onclick="addTag(${i})">${esc(t)}</button>`).join('')}</div>
  <label>Allergens in this recipe (comma-separated, e.g. egg, dairy)</label><input id="f-all" value="${esc(A(r.allergens).join(', '))}">
  <div class="two"><div><label>Servings</label><input id="f-serv" value="${esc(r.servings)}"></div><div><label>Time</label><input id="f-time" value="${esc(r.time)}"></div></div>
  <label>Source link</label><input id="f-url" value="${esc(r.source_url)}">
  <label>Ingredients (one per line)</label><textarea id="f-ing">${esc(A(r.ingredients).join('\n'))}</textarea>
  <label>Steps (one per line)</label><textarea id="f-steps">${esc(A(r.steps).join('\n'))}</textarea>
  <label>Notes</label><textarea id="f-notes" style="min-height:50px">${esc(r.notes)}</textarea>
  <div class="row"><button class="p" onclick="saveForm('${esc(id)}')">Save recipe</button><button onclick="detail('${esc(id)}')">Cancel</button></div>`);
}
async function saveForm(id){
  const ln=s=>$(s).value.split('\n').map(x=>x.trim()).filter(Boolean);
  const rec={title:$('#f-title').value.trim(),servings:$('#f-serv').value.trim(),time:$('#f-time').value.trim(),source_url:$('#f-url').value.trim(),ingredients:ln('#f-ing'),steps:ln('#f-steps'),notes:$('#f-notes').value.trim(),tags:uniq(L($('#f-tags').value)),allergens:uniq(L($('#f-all').value)),audience:undefined,protein:undefined};
  if(!rec.title){toast('Add a title');return}
  if(await mutate(upd(id,r=>({...r,...rec})),'Edit recipe: '+rec.title)){detail(id);toast('Saved')}
}

function prompt_(url,text){
  const src=(url?'Link: '+url+'\n':'')+(text?'Recipe text:\n'+text:'');
  return `You are helping me add recipes to my personal recipe database (a JSON file). Follow these instructions exactly.

INPUT
I will give you a link to a recipe (website, YouTube, Instagram), or the recipe text (caption, transcript, pasted page), or both. Use only what is in that source. If I gave both, use the text and do not try to open the link; the link is only the recipe's source.
- If I gave only a link and you cannot open it, or the recipe is not in the page text (for example it is only spoken or shown in a video), reply with only CANNOT_EXTRACT. Do not guess or reconstruct a recipe from the title.
- If a detail is missing (servings, time, a quantity), use "" or leave the quantity out. Never invent values.
- The source may contain several distinct recipes (for example a video with three dishes). Return one object per recipe, each with only its own ingredients and steps.

OUTPUT
Reply with ONLY a JSON array in a single code block, even if there is just one recipe. No text outside it, no trailing commas, no comments. Each recipe object has exactly these fields:

[
  {
    "title": "",
    "servings": "",
    "time": "",
    "ingredients": [],
    "steps": [],
    "notes": "",
    "tags": [],
    "allergens": []
  }
]

FIELD RULES
- title: the recipe's name, in plain text.
- servings: a string like "4" or "2 adults + 1 toddler", or "".
- time: total time like "35 min", or "".
- ingredients: array of strings, one per item, with quantity and unit as written in the source (e.g. "1 cup basmati rice"). Do not merge or drop items.
- steps: array of strings, one step per item, in order, as clear instructions. Do not number them.
- notes: tips, substitutions or baby-friendly adjustments from the source, as one string, or "".
- tags: 3 to 8 short lowercase tags. ALWAYS include (1) who it is for: "baby" if made for babies or toddlers, "adult" for a regular meal, or both "baby" and "adult" if it suits both (as written or with a simple tweak mentioned in the source); (2) the main protein: "veg", "egg", "chicken", "fish" or "meat" ("veg" if none of those; dairy and lentils count as veg). Then add cuisine, meal type or method tags (e.g. "indian", "breakfast", "one-pot"). Use the same word every time for the same thing.
- allergens: lowercase allergens present in the ingredients as written, from: egg, dairy, nuts, peanut, gluten, soy, fish, shellfish, sesame. Use [] if none. Do not guess from the dish name.

JSON RULES
- Valid JSON only: double quotes, escape quotes inside strings, no line breaks inside strings.
- Write in English, translating if the source is in another language.

SOURCE
${src||'(none provided)'}`;
}
async function cp(t){if(!t){toast('Add a link or text first');return}try{await navigator.clipboard.writeText(t);toast('Prompt copied')}catch{toast('Copy failed')}}
function addFlow(m){
  const tabs=`<div class="row" style="margin-top:0"><button class="${m==='name'?'':'p'}" onclick="addFlow()">From a link or text</button><button class="${m==='name'?'p':''}" onclick="addFlow('name')">Just the name</button></div>`;
  show(m==='name'?`<h2 style="margin-top:0">Add a recipe</h2>${tabs}
  <label>Recipe names (one per line)</label><textarea id="n-names"></textarea>
  <label>Tags for all of them (comma-separated)</label><input id="n-tags" placeholder="baby, veg">
  <label>Link (optional)</label><input id="n-url" placeholder="https://">
  <div class="row"><button class="p" onclick="quickAdd()">Add</button><button onclick="close()">Cancel</button></div>`
  :`<h2 style="margin-top:0">Add a recipe</h2>${tabs}
  <label>1. Recipe link</label><input id="a-url" placeholder="https://">
  <label>Recipe text, caption or transcript (leave empty if the link opens)</label><textarea id="a-text"></textarea>
  <div class="row"><button class="p" onclick="cp(prompt_($('#a-url').value.trim(),$('#a-text').value.trim()))">Copy prompt</button></div>
  <p class="mut">Paste the prompt into your AI chat. The link is saved with the recipe either way.</p>
  <label>2. Paste the AI's reply here</label><textarea id="a-json" placeholder='[{"title": ...}]'></textarea>
  <div class="row"><button class="p" onclick="parseReply()">Continue</button><button onclick="close()">Cancel</button></div>`);
}
const blank=(title,id,url,tags,x={})=>({id,title,servings:String(x.servings||''),time:String(x.time||''),source_url:url,ingredients:A(x.ingredients),steps:A(x.steps),notes:String(x.notes||''),tags,allergens:A(x.allergens).map(s=>s.toLowerCase()),added:today(),tried:[],planned:false});
async function quickAdd(){
  const names=$('#n-names').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!names.length){toast('Add at least one name');return}
  const tags=uniq(L($('#n-tags').value)),url=$('#n-url').value.trim(),n=Date.now().toString(36);
  if(await mutate(a=>[...a,...names.map((x,i)=>blank(x,n+i,url,tags))],'Add '+names.length+' recipe(s)')){close();toast('Added')}
}
function parseReply(){
  const t=$('#a-json').value,s=t.search(/[\[{]/);
  try{
    if(s<0)throw 0;
    const j=JSON.parse(t.slice(s,t.lastIndexOf(t[s]==='['?']':'}')+1)),url=$('#a-url').value.trim(),n=Date.now().toString(36);
    pending=(Array.isArray(j)?j:[j]).filter(x=>x&&x.title).map((x,i)=>blank(String(x.title).trim(),n+i,url||x.source_url||'',uniq(A(x.tags).map(g=>g.toLowerCase())),x));
    if(!pending.length)throw 0;
    review();
  }catch{toast(t.includes('CANNOT_EXTRACT')?'Extraction failed. Use the recipe text option.':'That is not valid JSON. Ask the chat to resend only the JSON.')}
}
function review(){
  show(`<h2 style="margin-top:0">Found ${pending.length} recipe${pending.length>1?'s':''}</h2>${pending.map((r,i)=>`<label class="ck"><input type="checkbox" class="pk" value="${i}" checked><span><b>${esc(r.title)}</b><br><span class="mut">${esc(r.tags.join(', '))} · ${r.ingredients.length} ingredients</span></span></label>`).join('')}
  <p class="mut">You can edit tags and details after saving.</p><div class="row"><button class="p" onclick="savePending()">Save selected</button><button onclick="close()">Cancel</button></div>`);
}
async function savePending(){
  const ok=[...document.querySelectorAll('.pk:checked')].map(c=>pending[+c.value]);
  if(ok.length&&await mutate(a=>[...a,...ok],'Add '+ok.length+' recipe(s)')){close();toast('Saved')}
}
function settings(){
  const c=cfg();
  show(`<h2 style="margin-top:0">Settings</h2>
  <label>Allergens to flag on this device (comma-separated, e.g. egg)</label><input id="s-a" value="${esc(avoid().join(', '))}">
  <h2>GitHub connection</h2><p class="mut">Needed to add, edit and delete. Stored only in this browser.</p>
  <div class="two"><div><label>Owner</label><input id="s-o" value="${esc(c.owner)}"></div><div><label>Repository</label><input id="s-r" value="${esc(c.repo)}"></div></div>
  <label>Branch</label><input id="s-b" value="${esc(c.branch)}">
  <label>Fine-grained token (Contents: read and write)</label><input id="s-t" type="password" value="${esc(c.token)}" autocomplete="off">
  <div class="row"><button class="p" onclick="saveSettings()">Save</button><button onclick="close()">Cancel</button></div>`);
}
function saveSettings(){
  const o={owner:$('#s-o').value.trim(),repo:$('#s-r').value.trim(),branch:$('#s-b').value.trim(),token:$('#s-t').value.trim()};
  Object.keys(o).forEach(k=>!o[k]&&delete o[k]);
  localStorage.setItem('cfg',JSON.stringify(o));localStorage.setItem('avoid',uniq(L($('#s-a').value)).join(', '));close();load();
}
load();
</script></body></html>
